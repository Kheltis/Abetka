<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<title>Dinos Abetka</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2450c6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Abetka">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: app shell, one centered column, bottom tab bar, full-screen lesson mode with sticky answer bar */
  --bg:#eef2f9; --surface:#ffffff; --ink:#15213d; --muted:#5b6683; --line:#d6ddec;
  --blue:#2450c6; --blue-soft:#dfe7fb; --sun:#f4c03e; --sun-ink:#1d1a10; --sun-soft:#fdf1cc; --red:#c8402c;
  --good:#17895c; --good-soft:#dcf3e8; --bad:#c8402c; --bad-soft:#fbe4df;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --surface:#172038; --ink:#e8ecf7; --muted:#9aa5c3; --line:#2a3555;
    --blue:#7d9bff; --blue-soft:#24325a; --sun:#f4c03e; --sun-soft:#3b3320; --red:#ff7a63;
    --good:#43d197; --good-soft:#163a2d; --bad:#ff7a63; --bad-soft:#41231f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#172038; --ink:#e8ecf7; --muted:#9aa5c3; --line:#2a3555;
  --blue:#7d9bff; --blue-soft:#24325a; --sun:#f4c03e; --sun-soft:#3b3320; --red:#ff7a63;
  --good:#43d197; --good-soft:#163a2d; --bad:#ff7a63; --bad-soft:#41231f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{overflow-x:clip;overscroll-behavior-x:none}
#app{width:100%;min-width:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
#app{max-width:680px;margin:0 auto;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#app.has-nav{padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

.stitch{height:10px;opacity:.85;
  background:linear-gradient(135deg,var(--red) 25%,transparent 25%) -5px 0/10px 10px,linear-gradient(225deg,var(--red) 25%,transparent 25%) -5px 0/10px 10px,
  linear-gradient(315deg,var(--ink) 25%,transparent 25%) 0 0/10px 10px,linear-gradient(45deg,var(--ink) 25%,transparent 25%) 0 0/10px 10px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px}
.brand{min-width:0}
.hello{font-size:20px;margin:0 0 12px}
.brand h1{font-size:22px;letter-spacing:.5px}
.brand small{display:block;color:var(--muted);font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring{width:34px;height:34px;flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .bgc{stroke:var(--blue-soft)} .ring .fgc{stroke:var(--sun);stroke-linecap:round;transition:stroke-dashoffset .5s}
.pagehead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.pagehead h2{font-size:22px}
.pagehead span{color:var(--muted);font-weight:800}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:12px;color:var(--muted);padding:0}
.nav button .ic{height:26px;display:grid;place-items:center;font-weight:900;font-size:18px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="true"]{color:var(--blue)}

/* cards & buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;font-size:17px;background:var(--blue-soft);color:var(--ink);min-height:50px}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 #b88a14}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.wide{width:100%}
.danger{color:var(--bad)!important;background:var(--bad-soft)!important}

/* home summary */
.today{display:grid;gap:12px}
.today .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meter{height:12px;border-radius:999px;background:var(--blue-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .4s}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;text-align:left;display:grid;gap:2px}
.qbtn b{font-size:16px} .qbtn span{font-size:13px;color:var(--muted);font-weight:700}
.qbtn .e{font-size:22px}
.qbtn:disabled{opacity:.5;cursor:default}

/* path */
.unit{margin:26px 0 8px;border-radius:18px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}
.unit small{display:block;font-weight:800;opacity:.85;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
.unit h2{font-size:18px}
.unit .p{font-weight:900;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.u-blue{--uc:var(--blue)} .u-sun{--uc:#d9a21c} .u-good{--uc:var(--good)} .u-red{--uc:var(--red)}
.unit{background:var(--uc)}
.path{display:flex;flex-direction:column;align-items:center;gap:34px;padding:18px 0}
.nodew{display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateX(var(--x));position:relative;width:150px;text-align:center}
.node{width:74px;height:70px;border-radius:50%;border:0;font-family:var(--display);font-size:20px;display:grid;place-items:center;
  background:var(--line);color:var(--muted);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 70%,#000)}
.node.done{background:var(--uc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--uc) 60%,#000)}
.node.next{background:var(--uc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--uc) 60%,#000),0 0 0 7px color-mix(in srgb,var(--uc) 25%,transparent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 color-mix(in srgb,var(--uc) 60%,#000),0 0 0 12px color-mix(in srgb,var(--uc) 12%,transparent)}}
.node:active{transform:translateY(4px)}
.nodel{font-weight:800;font-size:13px;line-height:1.25;color:var(--ink)}
.nodes{font-size:13px;color:#d9a21c;letter-spacing:1px}
.bubble{position:absolute;top:-30px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:900;font-size:13px;color:var(--blue);text-transform:uppercase;letter-spacing:.5px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:680px;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px;border-top:6px solid var(--uc,var(--blue))}
.sheet .kick{font-weight:900;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.sheet h2{font-size:22px}
.prevrow{display:flex;flex-wrap:wrap;gap:6px}
.prevrow span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:900;font-size:18px}
.sheet .acts{display:flex;gap:10px} .sheet .acts .btn{flex:1}

/* run */
.runtop{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.x{border:0;background:transparent;font-size:24px;line-height:1;padding:6px 8px;border-radius:10px;color:var(--muted)}
.bar{flex:1;height:14px;background:var(--blue-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .35s}
.combo{font-weight:900;color:#d9a21c;font-size:15px;white-space:nowrap}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:6px 0 18px}
.tag{background:var(--sun-soft);font-weight:900;font-size:13px;letter-spacing:.6px;text-transform:uppercase;border-radius:999px;padding:5px 12px}
.q{font-size:clamp(17px,4.4vw,21px);max-width:32ch}
.big-glyph{font-weight:900;font-size:clamp(84px,24vw,132px);line-height:1;letter-spacing:4px}
.big-glyph span{color:var(--blue)}
.emoji{font-size:clamp(60px,17vw,88px);line-height:1.1}
.word{font-weight:900;font-size:clamp(34px,9vw,52px);line-height:1.15;letter-spacing:.5px}
.de{font-weight:800;font-size:20px;color:var(--muted)}
.pron{font-size:14px;color:var(--muted);font-style:italic}
.sound{font-size:20px} .sound b{font-size:26px;color:var(--blue)}
.hint{max-width:42ch;margin:0;color:var(--muted)}
.say{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:6px}
.opts.one{grid-template-columns:1fr}
.opt{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 10px;font-weight:900;font-size:22px;min-height:70px;
  box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt small{font-size:15px;color:var(--muted);font-weight:800}
.opt .e{font-size:30px}
.opt kbd{position:absolute;top:6px;left:9px;font:700 11px var(--body);color:var(--muted);opacity:.7}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opt.sent{font-size:18px}
.slots{min-height:64px;width:100%;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;padding:8px 0}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.tile{min-width:52px;height:56px;padding:0 12px;border:2px solid var(--line);background:var(--surface);border-radius:14px;font-weight:900;font-size:24px;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
.slots .tile{border-color:var(--blue);background:var(--blue-soft)}
.typed{width:100%;min-height:68px;border:2px solid var(--blue);border-radius:16px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:32px;letter-spacing:2px;padding:6px 12px;overflow-wrap:anywhere}
.typed .ph{font-size:17px;font-weight:700;color:var(--muted);letter-spacing:0}
.caret{display:inline-block;width:3px;height:34px;background:var(--blue);margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kb{width:100%;display:grid;gap:6px;margin-top:4px;user-select:none;-webkit-user-select:none}
.kb .r{display:flex;gap:4px;justify-content:center}
.kb button{flex:1 1 0;max-width:48px;height:46px;padding:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:800;font-size:19px;box-shadow:0 2px 0 var(--line)}
.kb button.new{opacity:.45}
.kb button.wide{max-width:none;flex:3 1 0;font-size:15px}
.kb button.mid{max-width:none;flex:1.6 1 0;font-size:15px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.match .col{display:grid;gap:10px}
.match .opt{min-height:60px;font-size:22px}
.match .opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.match .opt.done{opacity:.25;border-color:var(--good)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tracebox{width:min(100%,340px,48vh);aspect-ratio:1;position:relative}
#trace{width:100%;height:100%;border:2px dashed var(--line);border-radius:22px;background:var(--surface);touch-action:none;display:block}
.tracemsg{min-height:24px;font-weight:800;color:var(--bad)}
.wprog{display:flex;gap:8px;justify-content:center;font-weight:900;font-size:30px;line-height:1.2}
.wprog span{color:var(--muted);min-width:22px;border-bottom:3px solid transparent}
.wprog .d{color:var(--good)}
.wprog .c{color:var(--blue);border-color:var(--blue)}
.abc button small.wst{color:#d9a21c;letter-spacing:1px}
.legend{font-size:13px;color:var(--muted);font-weight:700}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}

.foot{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg) 22%)}
.foot .acts{display:flex;gap:10px} .foot .acts .btn{flex:1}
.fb{border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;animation:fade .2s}
.fb.ok{background:var(--good-soft);border:2px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:2px solid var(--bad)}
.fb strong{font-size:18px;display:block}
.fb.ok strong{color:var(--good)} .fb.bad strong{color:var(--bad)}
.fb .sol{font-weight:800}
.fb .btn{min-width:130px}

/* result */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px 0}
.result .big{font-family:var(--display);font-size:clamp(34px,9vw,48px)}
.rstars{font-size:46px;letter-spacing:6px;color:#d9a21c}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:800}
.newbadge{display:flex;gap:12px;align-items:center;text-align:left;background:var(--sun-soft);border-radius:16px;padding:12px 14px;width:100%}
.newbadge .e{font-size:34px}

/* alphabet */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.abc button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-weight:900;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.abc button small{font-size:11px;color:var(--muted);font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.abc button.new{opacity:.4}
.abc button.sel{border:2px solid var(--blue);background:var(--blue-soft)}
.dots{position:absolute;top:5px;right:6px;display:flex;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.detail{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:14px}
.detail .g{font-weight:900;font-size:64px;line-height:1}

/* words */
.search{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:17px;margin-bottom:14px}
.wgroup{margin-bottom:16px}
.wgroup h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px;font-family:var(--body);font-weight:900}
.wrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.wrow .e{font-size:26px;text-align:center}
.wrow b{font-size:19px} .wrow span{color:var(--muted);font-weight:700;font-size:15px}
.str{display:flex;gap:3px}
.str i{width:7px;height:16px;border-radius:3px;background:var(--line)}
.str i.on{background:var(--good)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .e{font-size:44px}

/* profile */
.lvl{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lvl .badge{width:64px;height:64px;border-radius:18px;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:24px}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:12px;position:relative}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .b{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--blue-soft);min-height:4px}
.chart .b.hit{background:var(--sun)}
.chart .col.today .b{outline:2px solid var(--blue);outline-offset:1px}
.chart .v{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.chart .d{font-size:12px;font-weight:900;color:var(--muted)}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed var(--sun);pointer-events:none}
.tiles4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bdg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:2px;text-align:center}
.bdg .e{font-size:30px} .bdg b{font-size:14px} .bdg span{font-size:12px;color:var(--muted);font-weight:700}
.bdg.off{opacity:.45;filter:grayscale(1)}
.set{display:grid;gap:14px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.switch{width:56px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{left:28px}
.sec{margin:24px 0 10px;font-size:16px}

/* onboarding */
.onb{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center;align-items:center;padding:20px 0}
.onb .hero{font-family:var(--display);font-size:clamp(40px,12vw,64px);line-height:1.05}
.onb .hero span{color:var(--blue)}
.onb p{max-width:36ch;margin:0;color:var(--muted);font-size:18px}
.onb .list{display:grid;gap:10px;width:100%;text-align:left}
.onb .list div{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}

}

/* ================= Sicherung (Export / Import) ================= */
let pendingImport=null;
const BACKUP_DAYS=7;
const backupDue=()=>P.xp>0&&sync!=="cloud"&&Date.now()-(P.backup||0)>BACKUP_DAYS*864e5;
function fmtDate(ts){if(!ts)return "noch nie";const d=new Date(ts);return d.toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"});}
let exportText=null,importOpen=false;
const framed=()=>{try{return window.self!==window.top;}catch(e){return true;}};
async function exportBackup(){
  P.backup=Date.now(); save();
  const name="abetka-sicherung-"+dstr()+".json";
  const json=JSON.stringify({app:"abetka",format:1,exported:new Date().toISOString(),data:P});
  if(framed()){exportText=json;importOpen=false;render();return;}
  const file=new Blob([json],{type:"application/json"});
  try{
    const f=new File([file],name,{type:"application/json"});
    if(matchMedia("(pointer:coarse)").matches&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Abetka-Sicherung"});toast("Sicherung erstellt");render();return;}
  }catch(e){if(e&&e.name==="AbortError"){render();return;}}
  const url=URL.createObjectURL(file),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast("Sicherung gespeichert");render();
}
function openImport(){const i=document.getElementById("importfile");if(i){i.value="";i.click();}}
function parseImport(text){
  try{
    const o=JSON.parse(String(text).trim()),d=o&&o.app==="abetka"&&o.data?o.data:o;
    if(!d||typeof d!=="object"||typeof d.xp!=="number"||!d.lessons)throw 0;
    pendingImport={data:d,exported:o.exported?Date.parse(o.exported):(d.updated||0)};importOpen=false;
  }catch(e){toast("Das ist leider keine Abetka-Sicherung");return;}
  tab="me";view="home";render();
}
function readImport(file){const r=new FileReader();r.onload=()=>parseImport(r.result);r.readAsText(file);}
async function copyExport(){
  try{await navigator.clipboard.writeText(exportText);toast("Kopiert! Jetzt in der Web-App einfügen.");}
  catch(e){const t=document.getElementById("exporttext");if(t){t.focus();t.select();}toast("Bitte den markierten Text kopieren");}
}
function applyImport(){
  if(!pendingImport)return;
  P=normalize(pendingImport.data);P.onb=true;P.backup=Date.now();pendingImport=null;
  save();toast("Sicherung geladen. Willkommen zurück!");render();
}

    case "trace":
      body=traceHead(t,a)+`<div class="tracebox ${a.msg?"shake":""}"><canvas id="trace" aria-label="Zeichenfläche"></canvas></div><div class="tracemsg" role="status">${a.msg}</div>`;
      if(!a.status)foot=`<div class="acts"><button class="btn ghost" style="flex:0 0 58px;padding:0" data-a="tundo" aria-label="Letzten Strich zurücknehmen" ${a.strokes.length?"":"disabled"}>↶</button><button class="btn ghost" data-a="tclear">Löschen</button><button class="btn primary" data-a="tcheck" ${a.strokes.length?"":"disabled"}>Prüfen</button></div>`; break;
    case "l2s": body=`<h2 class="q">Welcher Laut ist das?</h2><div class="big-glyph">${glyph(it)}</div>`+opts(t,o=>o.sound); break;
    case "s2l": body=`<h2 class="q">Welcher Buchstabe klingt wie <span style="color:var(--blue)">${it.sound}</span>?</h2>`+opts(t,o=>`<span style="font-size:32px">${glyph(o)}</span>`); break;
    case "w_pick": body=`<h2 class="q">Wie schreibt man das auf Ukrainisch?</h2><div class="emoji">${it.emoji}</div><div class="de">${it.de}</div>`+opts(t,o=>o.uk); break;
    case "w_mean": body=`<h2 class="q">Was bedeutet das?</h2><div class="word">${it.uk}</div>`+opts(t,o=>`<span class="e">${o.emoji}</span><small>${o.de}</small>`); break;
    case "sm": body=`<h2 class="q">Was bedeutet der Satz?</h2><div class="word">${it.uk}</div>`+opts(t,o=>o.de,"one sent"); break;
    case "tf":{
      const ans=a.status?(a.picked===(t.shown.id===it.id)):null;
      body=`<h2 class="q">Passt das zusammen?</h2><div class="emoji">${it.emoji}</div><div class="de">${it.de}</div><div class="word" style="margin-top:4px">${t.shown.uk}</div>
        <div class="tf"><button class="opt ${a.status&&a.picked===true?(ans?"ok":"bad"):""}" data-a="tf" data-v="1" ${dis}><kbd>1</kbd>👍<small>Stimmt</small></button><button class="opt ${a.status&&a.picked===false?(ans?"ok":"bad"):""}" data-a="tf" data-v="0" ${dis}><kbd>2</kbd>👎<small>Stimmt nicht</small></button></div>`; break;}
    case "build": case "sb":{
      const sent=t.type==="sb";
      body=`<h2 class="q">${sent?"Bau den Satz":"Bau das Wort aus den Buchstaben"}</h2><div class="emoji" ${sent?'style="font-size:52px"':""}>${it.emoji}</div><div class="de">${it.de}</div>${sent?"":pronHtml(it)}
        <div class="slots" aria-label="Deine Antwort">${a.build.map((ti,k)=>`<button class="tile" data-a="unbuild" data-k="${k}" ${dis}>${t.tiles[ti]}</button>`).join("")}</div>
        <div class="tiles">${t.tiles.map((c,i)=>`<button class="tile ${a.build.includes(i)?"used":""}" data-a="build" data-i="${i}" ${dis}>${c}</button>`).join("")}</div>`;
      if(!a.status)foot=`<button class="btn primary wide" data-a="check" ${a.build.length?"":"disabled"}>Prüfen</button>`; break;}
    case "type":{
      const known=new Set(ALL.filter(x=>x.kind==="letter"&&P.items[x.id]).map(x=>x.lo)); Array.from(it.uk.toLowerCase()).forEach(c=>known.add(c));
      body=`<h2 class="q">Schreib das Wort auf Ukrainisch</h2><div class="emoji">${it.emoji}</div><div class="de">${it.de}</div>${pronHtml(it)}
        <div class="typed" aria-live="polite">${a.typed?a.typed:`<span class="ph">tippe unten auf die Buchstaben</span>`}${a.status?"":`<i class="caret"></i>`}</div>
        <div class="kb" aria-label="Ukrainische Tastatur">${KB.map(r=>`<div class="r">${r.map(k=>`<button data-a="key" data-k="${k}" class="${known.has(k)?"":"new"}" ${dis}>${k}</button>`).join("")}</div>`).join("")}
        <div class="r"><button class="mid" data-a="hint" ${dis}>Tipp 💡</button><button class="wide" data-a="key" data-k=" " ${dis}>Leerzeichen</button><button class="mid" data-a="bs" ${dis} aria-label="Löschen">⌫</button></div></div>`;
      if(!a.status)foot=`<button class="btn primary wide" data-a="check" ${a.typed.trim()?"":"disabled"}>Prüfen</button>`; break;}
    case "match":{
      const isL=t.items[0].kind==="letter";
      const L=o=>isL?glyph(o):o.uk,R=o=>isL?`<small style="font-size:17px;color:inherit">${o.sound}</small>`:`<span class="e">${o.emoji}</span>`;
      const cell=(o,side)=>{const done=a.matched.includes(o.id),s=side==="L"?a.selL===o.id:a.selR===o.id,sh=a.shake&&a.shake[side]===o.id;
        return `<button class="opt ${done?"done":""} ${s?"sel":""} ${sh?"shake":""}" data-a="m${side}" data-id="${o.id}" ${done?"disabled":""}>${side==="L"?L(o):R(o)}</button>`;};
      body=`<h2 class="q">Finde die Paare</h2><div class="match"><div class="col">${t.left.map(o=>cell(o,"L")).join("")}</div><div class="col">${t.right.map(o=>cell(o,"R")).join("")}</div></div>`; break;}
  }
  if(a.status){
    const ok=a.status==="ok";
    let sol;
    if(t.type==="match")sol=a.mm?`${a.mm} kleine${a.mm===1?"r":""} Patzer, aber alle gefunden!`:"Alle Paare ohne Fehler!";
    else if(t.type==="trace")sol=a.clean===false?"Gut geübt! Mit jedem Mal wird es sauberer.":`So schreibt man ${t.ch}.${a.score?` ${a.score} % getroffen.`:""}${a.up?` Neu: ${"★".repeat(a.up)} beim Schreiben!`:a.help?" Beim nächsten Mal klappt es ohne Hilfe!":""}`;
    else if(t.type==="tf")sol=t.shown.id===it.id?`Ja, ${it.uk} heißt ${it.de}.`:`${t.shown.uk} heißt ${t.shown.de}. ${it.de} ist ${it.uk}.`;
    else sol=ok?solution(it):"Richtig ist "+solution(it);
    const comboTxt=ok&&run.combo>=3&&t.type!=="intro"?` · 🔥 ${run.combo} in Folge`:"";
    foot=`<div class="fb ${ok?"ok":"bad"}" role="status"><div><strong>${ok?pick(PRAISE):pick(COMFORT)}${comboTxt}</strong><div class="sol">${sol}</div></div><button class="btn ${ok?"primary":"sun"}" data-a="next">Weiter</button></div>`;
  }
  const quit=run.quitAsk?`<div class="scrim"><div class="sheet" role="dialog" aria-label="Lektion beenden"><h2>Wirklich aufhören?</h2><div class="muted">Was du bis jetzt geübt hast, bleibt gespeichert. Die XP für diese Runde bekommst du aber erst am Ende.</div>
    <div class="acts"><button class="btn primary" data-a="stay">Weiterlernen</button><button class="btn ghost" data-a="quit2">Beenden</button></div></div></div>`:"";
  return `<div class="runtop"><button class="x" data-a="quit" aria-label="Beenden">✕</button><div class="bar"><i style="width:${pct}%"></i></div>${run.combo>=3?`<span class="combo">🔥${run.combo}</span>`:""}<span class="chip">+${run.xp}</span></div>
    <div class="stage ${fadeNow?"fade":""}">${body}</div><div class="foot">${foot}</div>${quit}`;
}
function renderResult(){
  const r=run,next=r.mode==="lesson"?LESSONS[ORD[r.id]+1]:null,acc=r.right+r.mistakes?Math.round(r.right/(r.right+r.mistakes)*100):100;
  const mm=Math.floor(r.secs/60),ss=String(r.secs%60).padStart(2,"0");
  return `<div class="result fade">
    <div class="big">Молодець${uname()?", "+uname():""}!</div><div class="muted" style="font-weight:800">Gut gemacht!${P.settings.pron?" · gesprochen: mo-lo-dez":""}</div>
    <div class="rstars" aria-label="${r.stars} von 3 Sternen">${"★".repeat(r.stars)}${"☆".repeat(3-r.stars)}</div>
    <div class="muted">${r.mode==="lesson"?`Lektion ${ORD[r.id]+1} · ${LBY[r.id].t}`:r.mode==="intens"?`Intensivkurs · ${UNITS[r.u].n}`:({weak:"Fehler geübt",trace:"Schreibtreppe",write:"Schreibrunde",wordwrite:"Wörter geschrieben"})[r.mode]||"Schnelle Runde"}</div>
    <div class="stats"><div class="stat"><b id="xpcount" data-to="${r.xp+r.bonus}">+0</b><span>XP</span></div><div class="stat"><b>${acc}%</b><span>Treffer</span></div><div class="stat"><b>${mm}:${ss}</b><span>Zeit</span></div><div class="stat"><b>🔥${streakNow()}</b><span>Tage</span></div></div>
    ${r.goalHit?`<div class="newbadge"><span class="e">🎯</span><div><b>Tagesziel geschafft!</b><div class="muted">Morgen wieder? Dann wächst deine Serie.</div></div></div>`:""}
    ${r.newBadges.map(b=>`<div class="newbadge"><span class="e">${b.e}</span><div><b>Neues Abzeichen · ${b.t}</b><div class="muted">${b.d}</div></div></div>`).join("")}
    <div style="display:grid;gap:10px;width:100%;margin-top:8px">
      ${next?`<button class="btn primary wide" data-a="lesson" data-id="${next.id}">Weiter mit Lektion ${ORD[next.id]+1}</button>`:""}
      ${r.mode==="intens"?`<button class="btn primary wide" data-a="intens" data-u="${r.u}">Noch eine Runde</button>`:""}
      <button class="btn ${next||r.mode==="intens"?"ghost":"primary"} wide" data-a="home">Zur Übersicht</button></div></div>`;
}
function countUp(){const el=document.getElementById("xpcount"); if(!el)return; const to=+el.dataset.to,t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/700); el.textContent="+"+Math.round(to*p); if(p<1)requestAnimationFrame(f);})(t0);}

/* ================= Nachzeichnen ================= */
const TFONT=s=>`900 ${s}px Nunito, "Segoe UI", sans-serif`;
let fontReady=false;
const isLow=ch=>ch!==ch.toUpperCase();
function drawGuide(ctx,ch,S,outline){ctx.font=TFONT(S*(isLow(ch)?0.95:0.74));ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx[outline?"strokeText":"fillText"](ch,S/2,S*0.74);}
function setupTrace(){
  const cv=document.getElementById("trace"); if(!cv)return;
  const t=cur(),a=run.ans,S=cv.clientWidth,dpr=window.devicePixelRatio||1,m=tmode(t,a);
  cv.width=S*dpr; cv.height=S*dpr; const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const paint=()=>{ctx.clearRect(0,0,S,S);
    ctx.strokeStyle=cssVar("--line");ctx.lineWidth=1;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(0,S*0.74);ctx.lineTo(S,S*0.74);ctx.stroke();ctx.setLineDash([]);
    paintGuide(ctx,t,a,m,S,dpr);
    ctx.strokeStyle=cssVar("--blue");ctx.lineWidth=S*0.055;ctx.lineCap="round";ctx.lineJoin="round";
    strokePath(ctx,a.strokes,S);};
  if(!fontReady&&document.fonts){document.fonts.load(TFONT(80)).then(()=>{fontReady=true;paint();}).catch(()=>{});}
  paint();
  if(a.status)return;
  let drawing=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=[pos(e)];a.strokes.push(drawing);a.msg="";a.miss=null;const me=document.querySelector(".tracemsg");if(me)me.textContent="";paint();});
  cv.addEventListener("pointermove",e=>{if(!drawing)return;e.preventDefault();drawing.push(pos(e));paint();});
  const end=()=>{if(drawing){drawing=null;document.querySelectorAll('[data-a="tcheck"],[data-a="tundo"]').forEach(b=>b.disabled=false);}};
  cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
}
function scoreTrace(ch,strokes,fit){
  const N=110,mk=()=>{const c=document.createElement("canvas");c.width=c.height=N;return c.getContext("2d",{willReadFrequently:true});};
  const g=mk(); drawGuide(g,ch,N);
  const gd=mk(); drawGuide(gd,ch,N); gd.lineWidth=N*0.1; gd.lineJoin="round"; gd.strokeText(ch,N/2,N*0.74);
  let skew=1; if(fit){const f=fitStrokes(g,strokes,N);strokes=f.strokes;skew=f.skew;}
  const line=(c,w)=>{c.lineCap=c.lineJoin="round";c.lineWidth=w;strokePath(c,strokes,N);};
  const u=mk(); line(u,N*0.055); const uT=mk(); line(uT,N*(fit?0.14:0.2));
  const A=c=>c.getImageData(0,0,N,N).data;
  const ga=A(g),gda=A(gd),ua=A(u),uta=A(uT);
  let gp=0,cov=0,up=0,on=0;
  for(let i=3;i<ga.length;i+=4){if(ga[i]>128){gp++;if(uta[i]>100)cov++;} if(ua[i]>128){up++;if(gda[i]>100)on++;}}
  return {coverage:gp?cov/gp:0,precision:up?on/up:0,skew};
}

/* ================= Aktionen ================= */
function typeChar(c){const a=run.ans; if(a.status||a.typed.length>24)return; a.typed+=c; sfx("tap"); render();}
function check(){
  const t=cur(),a=run.ans;
  if(t.type==="build")answer(a.build.map(i=>t.tiles[i]).join("").replace(/␣/g," ")===t.item.uk);
  if(t.type==="sb")answer(norm(a.build.map(i=>t.tiles[i]).join(" "))===norm(t.item.uk));
  if(t.type==="type")answer(norm(a.typed)===norm(t.item.uk));
}
function act(name,ds){
  switch(name){
    case "tab": tab=ds.v; sel=null; confirmReset=false; sheet=null; render(); window.scrollTo(0,0); break;
    case "onb": onbStep=+ds.v; render(); break;
    case "onbgo": P.onb=true; save(); begin("lesson",buildLesson("a1"),{id:"a1"}); break;
    case "onbskip": P.onb=true; save(); render(); break;
    case "sheet": sheet=ds.id; render(); break;
    case "closesheet": sheet=null; render(); break;
    case "lesson": begin("lesson",buildLesson(ds.id),{id:ds.id}); break;
    case "quick": begin("quick",buildQuick()); break;
    case "weak": begin("weak",buildQuick(weakItems())); break;
    case "tracepractice":{const it=BYID[ds.id]; begin("trace",buildStair(it)); break;}
    case "wround": begin("write",buildWriteRound()); break;
    case "intens": begin("intens",buildIntens(+ds.u),{u:+ds.u}); break;
    case "wwords": begin("wordwrite",buildWordWrite()); break;
    case "home": view="home"; tab=(run&&run.back)||"learn"; run=null; render(); window.scrollTo(0,0); break;
    case "quit": if(run.i===0){act("quit2");break;} run.quitAsk=true; render(); break;
    case "stay": run.quitAsk=false; render(); break;
    case "quit2": save(); view="home"; run=null; render(); break;
    case "next": next(); break;
    case "pick":{const t=cur(); if(run.ans.status)return; const o=t.opts[+ds.i]; run.ans.picked=o.id; answer(o.id===t.item.id); break;}
    case "tf":{const t=cur(); if(run.ans.status)return; const v=ds.v==="1"; run.ans.picked=v; answer(v===(t.shown.id===t.item.id)); break;}
    case "build": if(!run.ans.build.includes(+ds.i)){run.ans.build.push(+ds.i);sfx("tap");render();} break;
    case "unbuild": run.ans.build.splice(+ds.k,1); render(); break;
    case "key": typeChar(ds.k); break;
    case "bs": run.ans.typed=run.ans.typed.slice(0,-1); render(); break;
    case "hint":{const w=cur().item.uk,a=run.ans; let p=0; while(p<a.typed.length&&p<w.length&&norm(a.typed[p])===norm(w[p]))p++; a.typed=w.slice(0,Math.min(w.length,p+1)); a.hinted=true; render(); break;}
    case "check": check(); break;
    case "tclear": run.ans.strokes=[]; run.ans.msg=""; run.ans.miss=null; render(); break;
    case "tundo": run.ans.strokes.pop(); run.ans.msg=""; render(); break;
    case "tcheck": traceCheck(); break;
    case "mL": case "mR":{
      const a=run.ans,t=cur(); if(name==="mL")a.selL=ds.id; else a.selR=ds.id; a.shake=null;
      if(a.selL&&a.selR){
        if(a.selL===a.selR){a.matched.push(a.selL);srs(a.selL,true);sfx("tap");}
        else{a.mm++;a.shake={L:a.selL,R:a.selR};sfx("bad");}
        a.selL=a.selR=null;
        if(a.matched.length===t.items.length){a.status="ok"; if(a.mm<=1){run.xp+=5;run.right++;run.combo++;sfx("ok");} else run.mistakes++; saveLocal();}
      }
      render(); break;}
    case "sel": sel=sel===ds.id?null:ds.id; render(); break;
    case "say": speak(ds.t); break;
    case "toggle": P.settings[ds.k]=!P.settings[ds.k]; save(); render(); break;
    case "goal": P.settings.goal=+ds.v; save(); render(); break;
    case "reset1": confirmReset=true; render(); break;
    case "reset0": confirmReset=false; render(); break;
    case "export": exportBackup(); break;
    case "import": importOpen=true; exportText=null; pendingImport=null; render(); break;
    case "pickfile": openImport(); break;
    case "pastetext":{const t=document.getElementById("importtext"); if(t&&t.value.trim())parseImport(t.value); else toast("Bitte zuerst den Text einfügen"); break;}
    case "copyexp": copyExport(); break;
    case "closeexp": exportText=null; render(); break;
    case "import2": applyImport(); break;
    case "import0": pendingImport=null; importOpen=false; render(); break;
    case "reset2":{const s=P.settings; P=defaults(); P.settings=s; P.onb=true; confirmReset=false; save(); toast("Alles zurückgesetzt. Auf ein Neues!"); render(); break;}
  }
}
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b||b.disabled)return;
  if(b.classList.contains("scrim")&&e.target!==b)return;
  act(b.dataset.a,b.dataset);
});
app.addEventListener("change",e=>{if(e.target.id==="nameinput"){P.settings.name=e.target.value.trim().slice(0,20);save();render();toast(P.settings.name?"Hallo "+P.settings.name+"!":"Name entfernt");}});
app.addEventListener("input",e=>{if(e.target.id==="wsearch"){wq=e.target.value;document.getElementById("wlist").innerHTML=wordList();}});
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target&&e.target.tagName==="INPUT")return;
  if(sheet&&e.key==="Escape"){sheet=null;render();return;}
  if(view==="result"&&e.key==="Enter"){e.preventDefault();act("home",{});return;}
  if(view!=="run")return;
  const t=cur(),a=run.ans;
  if(run.quitAsk){if(e.key==="Escape"||e.key==="Enter")act("stay",{});return;}
  if(e.key==="Escape"){act("quit",{});return;}
  if(e.key==="Enter"){e.preventDefault(); if(a.status||t.type==="intro")return next();
    if((t.type==="build"||t.type==="sb")&&a.build.length)return check(); if(t.type==="type"&&a.typed.trim())return check(); if(t.type==="trace"&&a.strokes.length)return act("tcheck",{}); return;}
  if(a.status)return;
  if(t.opts&&/^[1-4]$/.test(e.key)&&t.opts[+e.key-1]){act("pick",{i:+e.key-1});return;}
  if(t.type==="tf"&&/^[12]$/.test(e.key)){act("tf",{v:e.key==="1"?"1":"0"});return;}
  if(t.type==="type"){
    if(e.key==="Backspace"){e.preventDefault();act("bs",{});return;}
    if(e.key===" "){e.preventDefault();typeChar(" ");return;}
    if(e.key.length===1&&/[Ѐ-ӿʼ'’]/.test(e.key)){e.preventDefault();typeChar(e.key==="'"||e.key==="’"?"ʼ":e.key.toLowerCase());return;}
    if(CODEMAP[e.code]){e.preventDefault();typeChar(CODEMAP[e.code]);return;}
  }
  if((t.type==="build"||t.type==="sb")&&e.key==="Backspace"&&a.build.length){a.build.pop();render();}
});
let lastW=window.innerWidth;
window.addEventListener("resize",()=>{if(window.innerWidth===lastW)return;lastW=window.innerWidth;if(view==="run"&&cur().type==="trace")render();});

function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("fx"),x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#2450c6","#f4c03e","#c8402c","#17895c"];
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*13,vy:Math.random()*-13-3,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore();}
    if(++f<130)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height);})();
}

document.getElementById("importfile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)readImport(f);});

render();
initSync();
askPersist();
/* Offline-Modus: Service Worker nur auf einer echten Webadresse (z. B. GitHub Pages) */
const inFrame=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
if("serviceWorker" in navigator&&!inFrame&&(location.protocol==="https:"||/^localhost$|^127\./.test(location.hostname))){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
}
